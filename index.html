<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beritaacara.me - Dashboard</title>
    <!-- Styling & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pop-ups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap');

        body {
            /* Font Figtree khas Laravel */
            font-family: 'Figtree', sans-serif;
            background-color: #f8fafc;
        }

        .glass {
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .modal-active {
            display: flex !important;
        }

        /* Custom Scrollbar kaku dan minimalis */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* SweetAlert kaku ala dashboard admin */
        .swal2-popup {
            border-radius: 0.75rem !important;
            font-family: 'Figtree', sans-serif !important;
        }

        /* Animasi Pop-up sederhana */
        @keyframes scaleIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-scaleIn {
            animation: scaleIn 0.2s ease-out forwards;
        }

        /* Sembunyikan panah input number */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body class="text-slate-800 h-screen flex flex-col relative overflow-hidden">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm p-4 z-10 flex justify-between items-center px-6">
        <h1 class="text-xl font-bold tracking-tight text-slate-800 flex items-center">
            beritaacara.me
        </h1>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-8 pb-24" id="main-container">

        <!-- Tampilan Kosong -->
        <div id="empty-state" class="hidden flex-col items-center justify-center h-full text-slate-400">
            <div class="bg-slate-100 p-6 rounded-lg mb-4 border border-slate-200">
                <i class="fas fa-box-open text-4xl text-slate-400"></i>
            </div>
            <p class="text-lg font-semibold text-slate-600">Data Kosong</p>
            <p class="text-sm mt-1">Tambahkan berita acara penghitungan uang untuk memulai.</p>
        </div>

        <!-- Grid Berita Acara -->
        <div id="report-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 max-w-7xl mx-auto">
            <!-- Kartu data dinamis akan muncul di sini -->
        </div>
    </main>

    <!-- Tombol Float (FAB) -->
    <button onclick="openModal()"
        class="fixed bottom-8 right-8 bg-indigo-600 text-white w-14 h-14 rounded-xl shadow-md border border-indigo-700 flex items-center justify-center text-xl hover:bg-indigo-700 transition-colors z-20">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Pop-up Modal Detail / Form (Posisi Selalu di Tengah) -->
    <div id="modal-detail"
        class="hidden fixed inset-0 bg-slate-900/60 z-50 items-center justify-center p-4 backdrop-blur-sm transition-all">
        <div
            class="glass w-full max-w-4xl rounded-xl flex flex-col max-h-[90vh] overflow-hidden animate-scaleIn border border-slate-200">

            <!-- Header Modal -->
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-white relative shrink-0">
                <div class="flex items-center gap-3">
                    <h2 class="text-xl font-bold text-slate-800" id="modal-title">Form Berita Acara</h2>

                    <!-- Tombol Hapus Laporan -->
                    <div id="header-actions"
                        class="hidden flex bg-slate-100 rounded-lg p-0.5 border border-slate-200 ml-2">
                        <button onclick="deleteReport()"
                            class="text-slate-500 hover:text-rose-600 hover:bg-white px-2.5 py-1 rounded-md text-sm transition"
                            title="Hapus Laporan Ini">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>

                <button onclick="closeModal()"
                    class="text-slate-400 hover:text-rose-600 transition h-8 w-8 flex items-center justify-center rounded-md hover:bg-rose-50 border border-transparent hover:border-rose-100 ml-2 shrink-0">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Body Modal -->
            <div class="p-5 flex-1 overflow-y-auto bg-slate-50">
                <input type="hidden" id="reportId">

                <div class="mb-5">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nama Laporan</label>
                    <input type="text" id="namaLaporan"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow text-sm"
                        placeholder="Contoh: Shift Pagi / Tutup Kasir">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Uang Kertas -->
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <h4
                            class="font-bold text-slate-700 tracking-wide mb-4 border-b border-slate-100 pb-2 text-sm flex items-center gap-2 uppercase">
                            <i class="fas fa-money-bill-wave text-indigo-500"></i> Uang Kertas
                        </h4>
                        <div class="space-y-3" id="kertasContainer"></div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                            <span class="font-bold text-slate-500 text-xs tracking-wider uppercase">Total Kertas</span>
                            <span id="totalKertas" class="font-bold text-indigo-600">Rp0</span>
                        </div>
                    </div>

                    <!-- Uang Koin -->
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
                        <h4
                            class="font-bold text-slate-700 tracking-wide mb-4 border-b border-slate-100 pb-2 text-sm flex items-center gap-2 uppercase">
                            <i class="fas fa-coins text-amber-500"></i> Uang Koin
                        </h4>
                        <div class="space-y-3" id="koinContainer"></div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                            <span class="font-bold text-slate-500 text-xs tracking-wider uppercase">Total Koin</span>
                            <span id="totalKoin" class="font-bold text-amber-600">Rp0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Modal (Simpan & Total) -->
            <div
                class="p-5 border-t border-slate-200 bg-white flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <div class="bg-indigo-50 p-2.5 rounded-lg border border-indigo-100 text-indigo-600">
                        <i class="fas fa-wallet text-xl"></i>
                    </div>
                    <div>
                        <p class="text-[11px] text-slate-500 font-bold tracking-wider mb-0.5">GRAND TOTAL</p>
                        <p id="grandTotal" class="text-2xl font-bold text-slate-800">Rp0</p>
                    </div>
                </div>
                <button onclick="saveReport()"
                    class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-6 rounded-lg transition-colors shadow-sm text-sm flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Simpan Data
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const pecahanKertas = [100000, 50000, 20000, 10000, 5000, 2000, 1000];
        const pecahanKoin = [1000, 500, 200, 100];

        // Data diambil dari LocalStorage perangkat
        let reports = JSON.parse(localStorage.getItem('beritaAcaraData')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            generateInputFields();
            renderList();
        });

        // 1. Generate Form Inputs
        function generateInputFields() {
            const kertasContainer = document.getElementById('kertasContainer');
            const koinContainer = document.getElementById('koinContainer');

            pecahanKertas.forEach(nominal => {
                kertasContainer.innerHTML += createInputRow(nominal, 'kertas');
            });

            pecahanKoin.forEach(nominal => {
                koinContainer.innerHTML += createInputRow(nominal, 'koin');
            });

            document.querySelectorAll('.input-qty').forEach(input => {
                input.addEventListener('input', calculateTotal);
            });
        }

        function createInputRow(nominal, type) {
            const formatNominal = formatRupiah(nominal).replace(',00', '');
            return `
                <div class="flex items-center justify-between gap-2">
                    <span class="text-sm font-semibold text-slate-600 w-20">${formatNominal}</span>
                    <span class="text-xs text-slate-400">x</span>
                    <input type="number" min="0" data-nominal="${nominal}" data-type="${type}" class="input-qty w-16 p-1.5 border-slate-300 rounded-md border text-center text-sm focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 outline-none transition bg-slate-50 focus:bg-white">
                    <span class="text-xs text-slate-400">=</span>
                    <span id="hasil-${nominal}-${type}" class="text-sm font-semibold text-slate-800 w-24 text-right">Rp0</span>
                </div>
            `;
        }

        // 2. Kalkulasi Uang
        function calculateTotal() {
            let totalK = 0;
            let totalC = 0;

            document.querySelectorAll('.input-qty').forEach(input => {
                const nominal = parseInt(input.getAttribute('data-nominal'));
                const type = input.getAttribute('data-type');
                const qty = parseInt(input.value) || 0;
                const subtotal = nominal * qty;

                document.getElementById(`hasil-${nominal}-${type}`).innerText = formatRupiah(subtotal).replace(',00', '');

                if (type === 'kertas') totalK += subtotal;
                if (type === 'koin') totalC += subtotal;
            });

            document.getElementById('totalKertas').innerText = formatRupiah(totalK).replace(',00', '');
            document.getElementById('totalKoin').innerText = formatRupiah(totalC).replace(',00', '');
            document.getElementById('grandTotal').innerText = formatRupiah(totalK + totalC).replace(',00', '');
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // 3. Kontrol Modal (Buka / Tutup)
        function openModal(id = null) {
            const modal = document.getElementById('modal-detail');
            const headerActions = document.getElementById('header-actions');
            const modalTitle = document.getElementById('modal-title');

            // Bersihkan form
            document.getElementById('reportId').value = '';
            document.getElementById('namaLaporan').value = '';
            document.querySelectorAll('.input-qty').forEach(input => input.value = '');
            calculateTotal();

            // Jika mode Edit (Klik List)
            if (id) {
                const report = reports.find(r => r.id === id);
                if (report) {
                    modalTitle.innerText = "Detail Berita Acara";
                    document.getElementById('reportId').value = report.id;
                    document.getElementById('namaLaporan').value = report.nama;

                    document.querySelectorAll('.input-qty').forEach(input => {
                        const nominal = input.getAttribute('data-nominal');
                        const type = input.getAttribute('data-type');
                        const key = `${type}_${nominal}`;
                        if (report.data[key]) {
                            input.value = report.data[key];
                        }
                    });
                    calculateTotal();
                    headerActions.classList.remove('hidden');
                }
            } else {
                modalTitle.innerText = "Berita Acara Baru";
                headerActions.classList.add('hidden');
            }

            modal.classList.add('modal-active');
        }

        function closeModal() {
            document.getElementById('modal-detail').classList.remove('modal-active');
        }

        // 4. Simpan Data ke Local Storage
        function saveReport() {
            const idInput = document.getElementById('reportId').value;
            const namaLaporan = document.getElementById('namaLaporan').value.trim();
            const grandTotalText = document.getElementById('grandTotal').innerText;

            if (!namaLaporan) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Oops...',
                    text: 'Nama laporan wajib diisi!',
                    confirmButtonColor: '#4f46e5'
                });
                return;
            }

            let totalItem = 0;
            const inputData = {};
            document.querySelectorAll('.input-qty').forEach(input => {
                const nominal = input.getAttribute('data-nominal');
                const type = input.getAttribute('data-type');
                const qty = parseInt(input.value) || 0;
                if (qty > 0) {
                    inputData[`${type}_${nominal}`] = qty;
                    totalItem += qty;
                }
            });

            if (totalItem === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Form Kosong',
                    text: 'Silakan isi jumlah lembar/keping uang terlebih dahulu.',
                    confirmButtonColor: '#4f46e5'
                });
                return;
            }

            const reportObj = {
                id: idInput ? parseInt(idInput) : Date.now(),
                nama: namaLaporan,
                tanggal: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                total: grandTotalText,
                data: inputData
            };

            if (idInput) {
                const index = reports.findIndex(r => r.id === parseInt(idInput));
                if (index !== -1) reports[index] = reportObj;
            } else {
                reports.unshift(reportObj);
            }

            localStorage.setItem('beritaAcaraData', JSON.stringify(reports));
            renderList();
            closeModal();

            Swal.fire({
                icon: 'success',
                title: 'Berhasil',
                text: 'Data berhasil disimpan!',
                showConfirmButton: false,
                timer: 1500
            });
        }

        // 5. Hapus Data
        function deleteReport() {
            const idInput = document.getElementById('reportId').value;
            if (!idInput) return;

            Swal.fire({
                title: 'Hapus Data Ini?',
                text: "Data yang dihapus tidak bisa dikembalikan.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, Hapus',
                cancelButtonText: 'Batal',
                customClass: {
                    confirmButton: '!bg-rose-600 !rounded-lg !px-5',
                    cancelButton: '!bg-white !text-slate-700 !border !border-slate-300 !rounded-lg !px-5 hover:!bg-slate-50'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    reports = reports.filter(r => r.id !== parseInt(idInput));
                    localStorage.setItem('beritaAcaraData', JSON.stringify(reports));
                    renderList();
                    closeModal();

                    Swal.fire({
                        icon: 'success',
                        title: 'Dihapus',
                        text: 'Laporan telah dihapus.',
                        showConfirmButton: false,
                        timer: 1500
                    });
                }
            });
        }

        // 6. Render Data ke Layar
        function renderList() {
            const listContainer = document.getElementById('report-list');
            const emptyState = document.getElementById('empty-state');

            listContainer.innerHTML = '';

            if (reports.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                reports.forEach(report => {
                    const card = document.createElement('div');
                    // Desain Card sesuai dengan gaya anggaran.me
                    card.className = "bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between hover:border-indigo-300 transition-colors cursor-pointer group relative overflow-hidden";
                    card.onclick = () => openModal(report.id);

                    card.innerHTML = `
                        <div class="absolute -right-4 -top-4 w-16 h-16 bg-slate-50 rounded-full z-0 group-hover:bg-indigo-50 transition-colors"></div>
                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="text-lg font-bold text-slate-800 group-hover:text-indigo-600 transition pr-6 line-clamp-1">${report.nama}</h3>
                                <div class="text-slate-300 group-hover:text-indigo-600 transition"><i class="fas fa-chevron-right text-sm"></i></div>
                            </div>
                            <div class="space-y-3">
                                <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                                    <span class="text-sm font-medium text-slate-500">Tanggal</span> 
                                    <span class="font-bold text-slate-700">${report.tanggal}</span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-5 pt-4 border-t border-slate-100 relative z-10">
                            <p class="text-[11px] text-slate-400 font-bold tracking-wider mb-0.5 uppercase">Total Dihitung</p>
                            <p class="text-xl font-bold text-indigo-600">${report.total}</p>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }
        }
    </script>
</body>

</html>
